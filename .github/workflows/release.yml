name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Package Windows
        run: npm run pack

      - name: Create Self-Signed Authenticode Certificate & Sign Executable
        shell: pwsh
        run: |
          Write-Host "Creating Code Signing Certificate for SimpleAntrian..."
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=CraftThingy Digital Innovation, O=CraftThingy Digital Innovation, C=ID" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath "dist/SimpleAntrian-win32-x64/SimpleAntrian-Certificate.cer"
          
          Write-Host "Signing SimpleAntrian.exe with Authenticode..."
          Set-AuthenticodeSignature -FilePath "dist/SimpleAntrian-win32-x64/SimpleAntrian.exe" -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          
          Get-AuthenticodeSignature -FilePath "dist/SimpleAntrian-win32-x64/SimpleAntrian.exe" | Format-List

      - name: Compress Windows Build & Compute SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/SimpleAntrian-win32-x64/*" -DestinationPath "SimpleAntrian-windows-x64.zip"
          (Get-FileHash -Path "SimpleAntrian-windows-x64.zip" -Algorithm SHA256).Hash | Out-File -FilePath "SimpleAntrian-windows-x64.zip.sha256" -Encoding ascii

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            SimpleAntrian-windows-x64.zip
            SimpleAntrian-windows-x64.zip.sha256

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Package Linux
        run: npm run pack-linux

      - name: Compress Linux Build & Compute SHA256
        run: |
          tar -czvf SimpleAntrian-linux-x64.tar.gz -C dist/SimpleAntrian-linux-x64 .
          sha256sum SimpleAntrian-linux-x64.tar.gz | awk '{print $1}' > SimpleAntrian-linux-x64.tar.gz.sha256

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            SimpleAntrian-linux-x64.tar.gz
            SimpleAntrian-linux-x64.tar.gz.sha256

  publish:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets

      - name: Generate Release Notes & Changelog
        run: node scripts/generate-release-notes.js
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: SimpleAntrian ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            SimpleAntrian-windows-x64.zip
            SimpleAntrian-windows-x64.zip.sha256
            SimpleAntrian-linux-x64.tar.gz
            SimpleAntrian-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
